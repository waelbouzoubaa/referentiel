services:

  # ── Base de données ─────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: middleware-postgres
    environment:
      POSTGRES_USER: middleware
      POSTGRES_PASSWORD: middleware
      POSTGRES_DB: middleware
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U middleware"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Service Python FastAPI ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: middleware-api
    env_file:
      - .env
    environment:
      MIDDLEWARE_DATABASE_URL: postgresql+asyncpg://middleware:middleware@middleware-postgres:5432/middleware
      MIDDLEWARE_STORAGE_BUCKET: ramery-ai-features-integration-catalogue-article
      GOOGLE_APPLICATION_CREDENTIALS: /app/certs/gcs-service-account.json
      CERT_PRIVATE_KEY_PATH: /app/certs/private_key.pem
      MIDDLEWARE_DEBUG: "true"
      MIDDLEWARE_LOG_LEVEL: DEBUG
      MIDDLEWARE_ENVIRONMENT: development
      MIDDLEWARE_INPUT_FOLDER: /data/input
      MIDDLEWARE_OUTPUT_FOLDER: /data/output
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MIDDLEWARE_API_URL: https://middleware-api.${MAIN_DOMAIN}
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config
      - ./data/input:/data/input
      - ./data/output:/data/output
      - uploads:/app/uploads
      - exports:/app/exports
      - ${GCS_KEY_FILE:-./certs/gcs-service-account.json}:/app/certs/gcs-service-account.json:ro
      - ./certs/maikhub-middleware-ramery.key:/app/certs/private_key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uvicorn middleware.api.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/src
      --proxy-headers
      --forwarded-allow-ips=*
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - infra_networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_networks"
      - "traefik.http.routers.middleware-api.rule=Host(`middleware-api.${MAIN_DOMAIN}`)"
      - "traefik.http.routers.middleware-api.entrypoints=websecure"
      - "traefik.http.services.middleware-api.loadbalancer.server.port=8000"
      - "traefik.http.routers.middleware-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.middleware-api.middlewares=core-ipallowList@docker"

  # ── Watcher SharePoint ───────────────────────────────────────────────────────
  watcher:
    build:
      context: ./watcher
      dockerfile: Dockerfile
    container_name: middleware-watcher
    env_file:
      - .env
    environment:
      MIDDLEWARE_API_URL: http://middleware-api:8000
      UPLOADS_DIR: /app/uploads
      PYTHONUNBUFFERED: "1"
      CERT_PRIVATE_KEY_PATH: /app/certs/private_key.pem
    volumes:
      - uploads:/app/uploads
      - watcher_state:/app/state
      - ./certs/maikhub-middleware-ramery.key:/app/certs/private_key.pem:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Interface de validation des mappings IA ─────────────────────────────────
  review_ui:
    build:
      context: ./streamlit_review
      dockerfile: Dockerfile
    container_name: middleware-review-ui
    environment:
      MIDDLEWARE_API_URL: http://middleware-api:8000
    volumes:
      - ./docs:/app/docs:ro
    #ports:
    #  - "8503:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - infra_networks
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=infra_networks"
      - "traefik.http.routers.refs-fournisseurs.rule=Host(`refs-fournisseurs.${MAIN_DOMAIN}`)"
      - "traefik.http.routers.refs-fournisseurs.entrypoints=websecure"
      - "traefik.http.services.refs-fournisseurs.loadbalancer.server.port=8501"
      - "traefik.http.routers.refs-fournisseurs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.refs-fournisseurs.middlewares=core-ipallowList@docker"

volumes:
  postgres_data:
  uploads:
  exports:
  watcher_state:

networks:
  default:
    name: middleware-network
  infra_networks:
    external: true
